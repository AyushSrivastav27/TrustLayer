name: TrustLayer CI & Security Gate

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

  quality-gate:
    name: TrustLayer Security Dogfooding & Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Clean Scan on demo-fixed (Expect Exit 0)
        run: node src/cli.js scan ./demo-fixed --no-report

      - name: Verify Vulnerability Detection on demo
        run: |
          echo "Scanning intentionally vulnerable demo..."
          node src/cli.js scan ./demo --no-report || exit_code=$?
          if [ "${exit_code:-0}" -ne 1 ]; then
            echo "Expected exit code 1 due to critical/high findings, got ${exit_code:-0}"
            exit 1
          fi
          echo "Vulnerabilities successfully flagged with exit code 1 as expected."
