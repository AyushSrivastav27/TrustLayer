name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        run: npm test

      - name: Verify clean scan on demo-fixed (0 findings)
        run: npm run scan:fixed -- --no-banner --fail-on medium

      - name: Verify detection pipeline on vulnerable demo
        run: node src/cli.js scan ./demo --no-banner --fail-on none

      - name: Run scanner performance benchmarks
        run: npm run benchmark
