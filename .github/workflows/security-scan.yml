name: Security Scan (TrustLayer SARIF)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: TrustLayer SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TrustLayer SAST Scan (SARIF Export)
        run: |
          node src/cli.js scan . \
            -f sarif \
            -o trustlayer-report.sarif \
            --no-banner \
            --fail-on none

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trustlayer-report.sarif
          category: trustlayer-sast
        continue-on-error: true
